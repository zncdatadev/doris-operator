apiVersion: doris.kubedoop.dev/v1alpha1
kind: DorisCluster
metadata:
  labels:
    app.kubernetes.io/name: doris-operator
  name: doriscluster-sample
spec:
  image:
    productVersion: ($values.product_version)
  clusterConfig:
    # This fixture intentionally reduces a 3-BE / replication-3 ephemeral
    # cluster to one BE. Doris correctly rejects safe decommission for that
    # topology, so exercise the explicit destructive strategy instead.
    scaleDownPolicy:
      backendStrategy: force-drop
  frontend:
    roleGroups:
      default:
        replicas: 1
        config:
          resources:
            cpu: {}
  backend:
    roleGroups:
      default:
        replicas: 1
        config:
          resources:
            cpu: {}
        envOverrides:
          SKIP_CHECK_ULIMIT: "true"
  broker:
    roleGroups:
      default:
        replicas: 1
