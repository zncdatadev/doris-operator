apiVersion: doris.kubedoop.dev/v1alpha1
kind: DorisCluster
metadata:
  labels:
    app.kubernetes.io/name: doris-operator
    app.kubernetes.io/managed-by: kustomize
  name: doriscluster-sample
spec:
  frontend:
    roleGroups:
      default:
        replicas: 1
  backend:
    roleGroups:
      default:
        replicas: 1
  broker:
    roleGroups:
      default:
        replicas: 2
